<title>MX60 Field Tools</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
{{TOKENS}}

/* ===========================================================================
   MX60 Field Tools — eight forms, one job header, one record store.

   LAYOUT  one column throughout, operated with a thumb through windscreen
           glare. A home screen that is a list of forms and their state; a form
           that is a stack of groups ending in the clearance gate; a history
           that is a list of records and where each one has got to. Nothing is
           behind a menu and nothing needs a second tap to see.
   COLOUR  the document family's own tokens. Future Green marks a cleared item
           and a delivered record; Parametrix Red marks what is outstanding and
           a locked gate; Optimistic Yellow marks a record waiting to be sent.
           Nothing else is coloured.
   TYPE    the brand stacks. Item text is set large enough to read at arm's
           length; counts, times and record ids are tabular.
   =========================================================================== */
:root{
  --app-row:#FFFFFF;
  --done:var(--brand-green);
  --na:var(--brand-gray);
  --open:var(--brand-red);
  --wait:var(--brand-yellow);
  --app-ink:var(--brand-charcoal);
  --app-ground:#F2F2F2;
  --tap:56px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --app-row:#262626; --app-ground:#1A1A1A; --app-ink:#F2F2F2;
}}
:root[data-theme="dark"]{ --app-row:#262626; --app-ground:#1A1A1A; --app-ink:#F2F2F2 }

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--app-ground); color:var(--app-ink);
  font:400 16px/1.5 var(--brand-body);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:30;background:var(--brand-charcoal)}
.wrap{max-width:48rem;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* --- the band ----------------------------------------------------------- */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--brand-charcoal);color:#fff}
.band .wrap{padding-block:9px;display:flex;align-items:center;gap:12px}
.band img{height:20px;width:auto;flex:0 0 auto}
.band .who{flex:1 1 auto;min-width:0}
.band .who b{display:block;font:700 13px/1.25 var(--brand-body);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .who span{display:block;font:500 10px/1.4 var(--brand-body);
  letter-spacing:.12em;text-transform:uppercase;color:var(--brand-gray-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .act{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.band .act button{min-height:40px;padding:6px 10px;border-radius:2px;
  font:700 11px/1.2 var(--brand-body);letter-spacing:.07em;text-transform:uppercase;
  color:#fff;border:1px solid #5A5A5A}
.tally{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.tally b{font:700 19px/1 var(--brand-body)}
.tally span{display:block;font:500 9.5px/1.4 var(--brand-body);
  letter-spacing:.1em;text-transform:uppercase;color:var(--brand-gray-1)}
.meter{display:flex;gap:2px;height:4px}
.meter i{flex:1 1 0;background:#4A4A4A}
.meter i.on{background:var(--done)}
.meter i.part{background:var(--wait)}

main .wrap{padding-block:14px 30px}

/* --- shared pieces ------------------------------------------------------ */
.card{background:var(--app-row);border:1px solid var(--rule);margin-bottom:10px}
.card>h2,.grp>h2{margin:0;display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--rule);
  font:700 15px/1.3 var(--brand-head)}
.gid{flex:0 0 auto;font:700 11px/1 var(--brand-body);letter-spacing:.08em;
  background:var(--brand-gray-3);color:var(--brand-charcoal);padding:5px 7px;border-radius:2px}
.gn{margin-left:auto;flex:0 0 auto;font:600 12px/1 var(--brand-body);
  color:var(--muted);font-variant-numeric:tabular-nums}
.grp[data-done="1"]>h2 .gid{background:var(--done);color:#fff}
.note{padding:11px 14px;border-bottom:1px solid var(--rule);
  background:var(--panel);font:400 14px/1.55 var(--brand-body);color:var(--ink-2)}
.note strong{color:var(--ink)}
.note.caution{background:color-mix(in srgb,var(--brand-red) 9%,transparent);
  border-left:4px solid var(--open)}
.lead{font:400 15px/1.6 var(--brand-body);color:var(--ink-2);margin:0 0 14px;max-width:62ch}
.eyebrow{font:700 10px/1.5 var(--brand-body);letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chip{display:inline-block;padding:3px 8px;border-radius:2px;
  font:700 10px/1.5 var(--brand-body);letter-spacing:.09em;text-transform:uppercase;
  background:var(--brand-gray-3);color:var(--brand-charcoal)}
.chip.done{background:var(--done);color:#fff}
.chip.part{background:var(--wait);color:var(--brand-charcoal)}
.chip.wait{background:var(--wait);color:var(--brand-charcoal)}
.chip.sent{background:var(--done);color:#fff}
.chip.moving{background:var(--brand-blue);color:#fff}
.chip.void{background:var(--brand-charcoal);color:#fff}
.chip.super{background:var(--brand-gray-1);color:var(--brand-charcoal)}
.band-amend{padding:11px 14px;border:1px solid var(--rule);border-left:4px solid var(--open);
  background:var(--panel);margin-bottom:10px;font:400 14px/1.55 var(--brand-body)}
.band-amend b{display:block;font:700 10px/1.6 var(--brand-body);letter-spacing:.12em;
  text-transform:uppercase;color:var(--open)}
.band-amend code{font-family:var(--brand-mono);font-size:12px}
.chip.open{background:var(--open);color:#fff}

/* --- home --------------------------------------------------------------- */
.jobcard{display:block;width:100%;text-align:left;padding:14px;
  background:var(--app-row);border:1px solid var(--rule);margin-bottom:14px}
.jobcard[data-want="1"]{border-color:var(--open);border-width:2px}
.jobgrid{display:grid;gap:10px 18px;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));
  margin-top:10px}
.jobgrid div{min-width:0}
.jobgrid b{display:block;font:700 9.5px/1.5 var(--brand-body);letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.jobgrid span{display:block;font:600 15px/1.4 var(--brand-body);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobgrid span.none{color:var(--open);font-weight:500}
.formlist{display:grid;gap:8px}
.formbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;min-height:var(--tap);background:var(--app-row);
  border:1px solid var(--rule)}
.formbtn .fi{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;
  border-radius:2px;background:var(--brand-gray-3);color:var(--brand-charcoal);
  font:700 11px/1 var(--brand-body);letter-spacing:.04em}
.formbtn[data-state="completed"] .fi{background:var(--done);color:#fff}
.formbtn[data-state="progress"] .fi{background:var(--wait);color:var(--brand-charcoal)}
.formbtn .ft{flex:1 1 auto;min-width:0}
.formbtn .ft b{display:block;font:700 15px/1.3 var(--brand-body)}
.formbtn .ft span{display:block;font:400 13px/1.45 var(--brand-body);color:var(--muted)}
.formbtn .fs{flex:0 0 auto}
.hits{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.hits button{display:block;width:100%;text-align:left;padding:11px 13px;
  background:var(--app-row);min-height:48px;font:400 14px/1.45 var(--brand-body)}
.hits .hk{display:block;font:700 10px/1.5 var(--brand-body);letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

/* --- fields ------------------------------------------------------------- */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.flab{font:700 10px/1.4 var(--brand-body);letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.extra input,.extra textarea,.cell input{
  min-height:44px;padding:8px 10px;background:var(--ground);
  border:1px solid var(--rule-2);border-radius:2px;width:100%}
.fld textarea{min-height:66px;resize:vertical}
.fld input.want,.extra input.need,.pick.want{border-color:var(--open)}
.fld input:disabled,.fld textarea:disabled{background:var(--panel);color:var(--ink-2)}
.jobform{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));
  padding:14px}
.req{color:var(--open);font-weight:700}

/* --- a checklist item --------------------------------------------------- */
.itemwrap{border-bottom:1px solid var(--rule)}
.grp .itemwrap:last-child{border-bottom:0}
.itemwrap[hidden]{display:none}
.item{display:flex;align-items:flex-start;gap:0}
.tick{flex:1 1 auto;min-width:0;display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;min-height:var(--tap);text-align:left}
.box{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:2px solid var(--rule-2);
  border-radius:2px;display:grid;place-items:center;font:700 16px/1 var(--brand-body);
  color:transparent;background:var(--ground)}
.item[data-s="done"] .box{background:var(--done);border-color:var(--done);color:#fff}
.item[data-s="na"] .box{background:var(--na);border-color:var(--na);color:#fff;
  font-size:9.5px;letter-spacing:.03em}
.txt{flex:1 1 auto;min-width:0}
.txt .t{display:block}
.txt .num{display:inline-block;min-width:1.5em;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums}
.item[data-s="done"] .txt .t,.item[data-s="na"] .txt .t{color:var(--muted)}
.item[data-s="na"] .txt .t{text-decoration:line-through}
.sub{display:block;margin-top:2px;font:400 13px/1.45 var(--brand-body);color:var(--ink-2)}
.sub b{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px;
  color:var(--muted)}
.refs{display:block;margin-top:3px;font:500 12px/1.45 var(--brand-body);color:var(--muted)}
.refs b{font-weight:700;color:var(--brand-blue)}
.side{flex:0 0 auto;display:flex;align-items:center;align-self:stretch;
  border-left:1px solid var(--rule)}
.side button{min-width:48px;min-height:var(--tap);align-self:stretch;
  font:700 11px/1.2 var(--brand-body);letter-spacing:.06em;color:var(--muted)}
.side button+button{border-left:1px solid var(--rule)}
.side button[aria-pressed="true"]{background:var(--brand-gray-3);color:var(--brand-charcoal)}
.tick:disabled,.side button:disabled{cursor:default;opacity:1}
.extra{padding:0 14px 12px;display:grid;gap:8px}
.extra[hidden]{display:none}
.extra label{font:700 10px/1.4 var(--brand-body);letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.extra textarea{min-height:66px;resize:vertical}
.needval{display:block;margin-top:3px;font:700 11px/1.4 var(--brand-body);
  letter-spacing:.06em;text-transform:uppercase;color:var(--open)}

/* --- a record-form field ------------------------------------------------ */
.rowfld{padding:12px 14px;border-bottom:1px solid var(--rule);display:grid;gap:7px}
.rowfld:last-child{border-bottom:0}
.rowfld[hidden]{display:none}
.rowfld .flab .req{margin-left:5px}
.rowfld[data-done="1"] .flab .req{display:none}
.rowfld .fromjob{font:500 12px/1.4 var(--brand-body);color:var(--muted)}
.rowfld .carried{font:400 15px/1.45 var(--brand-body);padding:9px 10px;
  background:var(--panel);border:1px solid var(--rule);border-radius:2px;color:var(--ink-2)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{padding:10px 13px;min-height:44px;border:1px solid var(--rule-2);border-radius:2px;
  background:var(--ground);font:500 14px/1.3 var(--brand-body);text-align:left}
.pick[aria-pressed="true"]{background:var(--brand-charcoal);color:#fff;
  border-color:var(--brand-charcoal)}
.pick[aria-pressed="true"] strong{color:#fff}
.checkbtn{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;
  font:500 15px/1.4 var(--brand-body)}
.checkbtn .box{width:24px;height:24px}
.checkbtn[aria-pressed="true"] .box{background:var(--done);border-color:var(--done);color:#fff}
.hint{font:500 13px/1.4 var(--brand-body);color:var(--muted)}
.part{display:grid;gap:6px}
.part>.flab{text-transform:none;letter-spacing:.02em;font-size:12px;font-weight:600}

/* --- a repeating table -------------------------------------------------- */
.tbl{padding:10px 14px 14px;display:grid;gap:10px}
.trow{border:1px solid var(--rule);background:var(--ground)}
.trow>.rn{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-bottom:1px solid var(--rule);background:var(--panel);
  font:700 10px/1.5 var(--brand-body);letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted)}
.trow>.rn button{font:700 11px/1.2 var(--brand-body);color:var(--open);
  min-height:36px;padding:4px 8px;letter-spacing:.06em}
.cell{padding:9px 10px;display:grid;gap:5px}
.cell+.cell{border-top:1px solid var(--rule)}
.addrow{min-height:46px;border:1px dashed var(--rule-2);border-radius:2px;
  font:700 12px/1.2 var(--brand-body);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-2)}

/* --- search ------------------------------------------------------------- */
.find{background:var(--app-ground);position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 60px);z-index:15}
.find.flat{position:static}
.find .wrap{padding-block:10px;display:flex;align-items:center;gap:10px}
.find input{flex:1 1 auto;min-width:0;min-height:44px;padding:8px 12px;
  background:var(--app-row);border:1px solid var(--rule-2);border-radius:2px}
.find .n{flex:0 0 auto;font:500 12px/1.4 var(--brand-body);color:var(--muted);
  font-variant-numeric:tabular-nums}

/* --- the gate ----------------------------------------------------------- */
.gate{border:2px solid var(--open);background:var(--app-row);padding:16px;margin-top:4px}
.gate[data-ready="1"]{border-color:var(--done)}
.gate h2{margin:0 0 6px;font:700 17px/1.25 var(--brand-head)}
.gate p{margin:0 0 12px;font:400 14px/1.55 var(--brand-body);color:var(--ink-2);max-width:60ch}
.sigrow{margin:0 0 14px;max-width:22rem}
.sigrow[hidden]{display:none}
.out{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:1px;
  background:var(--rule);border:1px solid var(--rule);max-height:14rem;overflow-y:auto}
.out li{background:var(--app-row)}
.out button{display:block;width:100%;text-align:left;padding:10px 12px;min-height:44px;
  font:500 14px/1.4 var(--brand-body)}
.out .oid{font:700 11px/1 var(--brand-body);letter-spacing:.07em;color:var(--open);
  margin-right:8px}
.go{display:block;width:100%;min-height:54px;padding:14px;
  background:var(--done);color:#fff;border-radius:2px;
  font:700 15px/1.2 var(--brand-body);letter-spacing:.04em;text-transform:uppercase}
.go[disabled]{background:var(--brand-gray-2);color:var(--brand-gray);cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts button{flex:1 1 9rem;min-height:48px;padding:12px;border:1px solid var(--brand-charcoal);
  border-radius:2px;font:700 13px/1.2 var(--brand-body);letter-spacing:.04em;
  background:var(--ground)}
.acts button.quiet{border-color:var(--rule-2);color:var(--muted)}
.acts button.danger{border-color:var(--open);color:var(--open)}
.acts button[disabled]{opacity:.5;cursor:not-allowed}
.said{margin-top:10px;font:500 13px/1.5 var(--brand-body);color:var(--ink-2)}
.said.bad{color:var(--open)}
.cleared{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;
  font:700 13px/1.4 var(--brand-body);letter-spacing:.05em;text-transform:uppercase;
  color:var(--done)}
.cleared .dot{width:12px;height:12px;border-radius:50%;background:var(--done);
  flex:0 0 auto;margin-top:3px}
.offline{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:2px;
  background:var(--wait);color:var(--brand-charcoal);
  font:700 9.5px/1.6 var(--brand-body);letter-spacing:.1em;text-transform:uppercase}

/* --- history ------------------------------------------------------------ */
.recs{display:grid;gap:8px}
.recbtn{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 14px;min-height:var(--tap);background:var(--app-row);border:1px solid var(--rule)}
.recbtn .rt{flex:1 1 auto;min-width:0}
.recbtn .rt b{display:block;font:700 15px/1.3 var(--brand-body)}
.recbtn .rt span{display:block;font:400 13px/1.5 var(--brand-body);color:var(--muted);
  font-variant-numeric:tabular-nums}
.empty{padding:20px 14px;background:var(--app-row);border:1px dashed var(--rule-2);
  font:400 14px/1.6 var(--brand-body);color:var(--muted)}

/* --- provenance --------------------------------------------------------- */
.prov{border-top:1px solid var(--rule);margin-top:22px}
.prov .wrap{padding-block:16px 26px;font:400 12px/1.6 var(--brand-body);color:var(--muted)}
.prov b{color:var(--ink-2)}
.prov code{font-family:var(--brand-mono);font-size:11px}

/* --- the record sheet --------------------------------------------------- */
.rec{background:#fff;color:#1a1a1a}
.rec .wrap{padding-block:18px 26px}
.rec h1{margin:0;font:700 20px/1.2 var(--brand-head)}
.rec .rk{font:700 10px/1.5 var(--brand-body);letter-spacing:.14em;
  text-transform:uppercase;color:#676768}
.rec .rh{display:flex;align-items:flex-start;gap:14px;
  border-bottom:2px solid var(--brand-green);padding-bottom:9px;margin-bottom:14px}
.rec .rh img{height:26px;width:auto}
.rec table{width:100%;border-collapse:collapse;font:400 12.5px/1.5 var(--brand-body)}
.rec th,.rec td{text-align:left;vertical-align:top;padding:4px 8px 4px 0;
  border-bottom:1px solid #e5e5e5}
.rec th{font-weight:700;width:12rem}
.rec h3{margin:16px 0 4px;font:700 12px/1.4 var(--brand-body);letter-spacing:.1em;
  text-transform:uppercase;color:#676768}
.rec .st{font-weight:700;white-space:nowrap;width:5.5rem}
.rec .st.d{color:#2f8c38}
.rec .st.n{color:#676768}
.rec .st.o{color:#C62C16}
.rec .sn{display:block;color:#676768;font-style:italic}
.rec .sig{margin-top:18px;display:flex;gap:28px;flex-wrap:wrap;
  font:400 12.5px/1.6 var(--brand-body)}
.rec .pf{margin-top:18px;padding-top:8px;border-top:1px solid #e5e5e5;
  font:400 10.5px/1.6 var(--brand-body);color:#676768}
.rec .amend{margin:0 0 14px;padding:9px 11px;border:1px solid #C62C16;
  border-left:5px solid #C62C16;font:400 12px/1.5 var(--brand-body)}
.rec .amend b{display:block;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  font-size:10px;color:#C62C16}

@media print{
  body{background:#fff;color:#000}
  body::before,.band,.find,main,.prov{display:none!important}
  .rec{display:block!important}
  .rec .wrap{max-width:none;padding:0}
  .rec tr,.rec h3{break-inside:avoid;page-break-inside:avoid}
  @page{size:A4;margin:14mm 12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const DATA = {{DATA}};
const TARGET = "{{TARGET}}";

/* Where a completed record is posted. Left empty, nothing leaves the tablet on
   its own: the operator sends records through the iPad share sheet and the app
   keeps them until the office is confirmed to have them. Set it to the office
   endpoint once that endpoint exists, and a record completed with no signal
   posts itself the moment the tablet has one. A record is marked SENT only on
   a 2xx from that endpoint, or when the operator confirms the office has it —
   never because a share sheet opened. */
const SUBMIT_URL = "";

const FORMS = DATA.order.map(k => DATA.forms[k]);
const F = k => DATA.forms[k];
const CLEARED = s => s === "done" || s === "na";
const E = (t, c, h) => { const e = document.createElement(t);
  if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e };

/* ---- local state. localStorage can throw, or come back empty in a private
   window or with site data cleared. The app works either way; it just stops
   surviving a reload, and it says so rather than pretending. -------------- */
let STORAGE_OK = true;
function load(k, dflt){
  try { const v = localStorage.getItem("mx60.ft." + k); return v ? JSON.parse(v) : dflt }
  catch (e) { STORAGE_OK = false; return dflt }
}
function save(k, v){
  try { localStorage.setItem("mx60.ft." + k, JSON.stringify(v)) }
  catch (e) { STORAGE_OK = false }
}

let JOBV = load("job", {});
let DRAFTS = load("drafts", {});
let INDEX = load("index", []);          // record headers, for history without IDB
let MSG = null;
let VIEW = { name: "home" };
const opened = new Set();

/* ---- the record store ---------------------------------------------------
   IndexedDB holds the whole record and its PDF. localStorage holds a header
   for each one so history still works if IndexedDB is unavailable, and holds
   the records themselves as a fallback (without the PDF, which is rebuilt
   from the record on demand — the record carries every value the PDF prints,
   so nothing is lost by not storing the bytes).
   Nothing in here ever deletes a record that has not been confirmed sent. */
const Store = (() => {
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(res => {
      let rq;
      try { rq = indexedDB.open("mx60-field-tools", 1) } catch (e) { return res(null) }
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains("records"))
          db.createObjectStore("records", { keyPath: "rid" });
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
      rq.onblocked = () => res(null);
    });
    return dbp;
  }
  const tx = async (mode, fn) => {
    const db = await open();
    if (!db) return null;
    return new Promise(res => {
      let out = null;
      const t = db.transaction("records", mode);
      const s = t.objectStore("records");
      fn(s, v => { out = v });
      t.oncomplete = () => res(out);
      t.onerror = () => res(null);
      t.onabort = () => res(null);
    });
  };
  const header = e => ({ rid: e.rid, formKey: e.formKey, status: e.status,
    completedAt: e.completedAt, handedAt: e.handedAt || null,
    sentAt: e.sentAt || null, how: e.how || "", job: e.job,
    voided: e.voided || null, supersededBy: e.supersededBy || null,
    supersedes: (e.record && e.record.amendment && e.record.amendment.supersedes) || null });
  return {
    async put(e){
      const ok = await tx("readwrite", s => s.put(e));
      INDEX = INDEX.filter(h => h.rid !== e.rid).concat([header(e)]);
      save("index", INDEX);
      if (ok === null){                        // no IndexedDB: keep it in LS
        const fb = load("records", []).filter(r => r.rid !== e.rid);
        const { pdf, ...rest } = e;
        save("records", fb.concat([rest]));
      }
      return true;
    },
    async get(rid){
      const e = await tx("readonly", (s, set) => {
        const r = s.get(rid); r.onsuccess = () => set(r.result);
      });
      return e || load("records", []).find(r => r.rid === rid) || null;
    },
    async all(){
      const e = await tx("readonly", (s, set) => {
        const r = s.getAll(); r.onsuccess = () => set(r.result);
      });
      if (e && e.length) return e;
      const fb = load("records", []);
      return fb.length ? fb : INDEX.map(h => ({ ...h, record: null }));
    },
    /* A record is removable only once the office is confirmed to have it.
       Nothing here removes anything on its own. */
    async remove(rid){
      const e = await this.get(rid);
      if (!e || e.status !== "sent") return false;
      await tx("readwrite", s => s.delete(rid));
      INDEX = INDEX.filter(h => h.rid !== rid); save("index", INDEX);
      save("records", load("records", []).filter(r => r.rid !== rid));
      return true;
    },
  };
})();

/* ---- drafts -------------------------------------------------------------
   One draft per form, held until that form is completed. A draft is never
   thrown away by the app. */
function draft(key){
  if (!DRAFTS[key])
    DRAFTS[key] = { items: {}, fields: {}, tables: {}, meta: {}, sign: "",
                    started: new Date().toISOString() };
  const d = DRAFTS[key];
  d.items = d.items || {}; d.fields = d.fields || {};
  d.tables = d.tables || {}; d.meta = d.meta || {};
  return d;
}
const saveDrafts = () => save("drafts", DRAFTS);

/* Reading and writing are separate on purpose. `draft`, `itemState` and the
   rest create what they are asked for, which is right when the operator has
   just tapped something — and wrong everywhere else. Home asks every form how
   far along it is; if that question created a draft for each one, all eight
   would report themselves started before anybody had touched them. It did.
   So anything that only looks uses the read accessors, which create nothing. */
const EMPTY_ITEM = Object.freeze({ s: "", note: "", val: "" });
const EMPTY_FIELD = Object.freeze({ v: [], f: [] });
const peek = k => DRAFTS[k] || null;
const readItem = (k, id) => (peek(k) && peek(k).items && peek(k).items[id]) || EMPTY_ITEM;
const readField = (k, id) => (peek(k) && peek(k).fields && peek(k).fields[id]) || EMPTY_FIELD;
const readTable = (k, id) => (peek(k) && peek(k).tables && peek(k).tables[id]) || null;
const readMeta = (k, id) => (peek(k) && peek(k).meta && peek(k).meta[id]) || "";
const readSign = k => (peek(k) && peek(k).sign) || "";
const isClosed = k => Boolean(peek(k) && peek(k).completedAt);

const itemState = (k, id) => {
  const d = draft(k);
  return (d.items[id] = d.items[id] || { s: "", note: "", val: "" });
};
const fieldState = (k, id) => {
  const d = draft(k);
  return (d.fields[id] = d.fields[id] || { v: [], f: [] });
};
const tableState = (k, t) => {
  const d = draft(k);
  if (!d.tables[t.id])
    d.tables[t.id] = Array.from({ length: t.rows }, () => t.cols.map(() => ({ v: "", f: "" })));
  return d.tables[t.id];
};

/* ---- is a thing finished? ---------------------------------------------- */
function partDone(part, val){
  if (part.kind === "text") return Boolean((val.v || "").trim());
  if (part.kind === "check") return val.v === true;
  if (val.v === "" || val.v == null) return false;
  const opt = part.options[val.v];
  return !opt.follow || Boolean((val.f || "").trim());
}
function fieldDone(key, f){
  if (f.job) return Boolean((JOBV[f.job] || "").trim());
  const st = readField(key, f.id);
  return f.parts.every((p, k) => partDone(p, st.v[k] === undefined
    ? { v: p.kind === "check" ? false : "", f: "" } : { v: st.v[k], f: st.f[k] || "" }));
}

/* Everything the gate is waiting for, in the order the operator meets it. */
function outstanding(key){
  const form = F(key), o = [];
  for (const j of DATA.job){
    if (!j.always && form.stage !== "Field") continue;
    if (!(JOBV[j.id] || "").trim())
      o.push({ k: j.label, why: "not filled in", go: "job" });
  }
  for (const m of form.meta)
    if (!readMeta(key, m.id).trim())
      o.push({ k: m.label, why: "not filled in", el: "m-" + m.id });
  if (form.kind === "checklist"){
    for (const g of form.groups) for (const i of g.items){
      const st = readItem(key, i.id);
      if (!CLEARED(st.s)) o.push({ k: i.id, why: i.text, el: i.id });
      else if (i.field && st.s === "done" && !(st.val || "").trim())
        o.push({ k: i.id, why: i.field.label + " not recorded", el: i.id });
    }
  } else {
    for (const g of form.groups) for (const f of g.fields){
      if (!f.required || fieldDone(key, f)) continue;
      o.push({ k: f.id, why: f.label + (f.job ? " — from the job header" : ""),
               el: f.job ? null : f.id, go: f.job ? "job" : null });
    }
  }
  const d = peek(key);
  if (d && d.supersedes && !(d.reason || "").trim())
    o.push({ k: "Reason", why: "say why this record replaces the earlier one",
             el: "m-reason" });
  if (form.sign && !readSign(key).trim())
    o.push({ k: form.sign, why: "not signed", el: "m-sign" });
  return o;
}
function progress(key){
  const form = F(key);
  if (form.kind === "checklist"){
    const all = form.groups.flatMap(g => g.items);
    return { done: all.filter(i => CLEARED(readItem(key, i.id).s)).length, of: all.length };
  }
  const req = form.groups.flatMap(g => g.fields).filter(f => f.required);
  return { done: req.filter(f => fieldDone(key, f)).length, of: req.length };
}
function started(key){
  const d = peek(key);
  if (!d) return false;
  return Object.keys(d.items).length > 0 || Object.keys(d.fields).length > 0
      || Object.keys(d.tables).length > 0 || Boolean(d.sign)
      || Object.keys(d.meta).length > 0;
}

/* ---- the record --------------------------------------------------------- */
function partText(part, val){
  if (part.kind === "text")
    return (val.v || "").trim() + (part.hint && val.v ? " " + part.hint : "");
  if (part.kind === "check")
    return (part.label ? part.label + " " : "") + (val.v === true ? "yes" : "—");
  if (val.v === "" || val.v == null) return "";
  const opt = part.options[val.v];
  return opt.t + (opt.follow && val.f ? " — " + opt.follow + ": " + val.f : "");
}
function fieldText(key, f){
  if (f.job) return (JOBV[f.job] || "");
  const st = readField(key, f.id);
  return f.parts.map((p, k) => partText(p, { v: st.v[k], f: st.f[k] || "" }))
    .filter(Boolean).join(" · ");
}
function makeRid(key){
  const form = F(key), j = JOBV;
  const d = (j.date || new Date().toISOString().slice(0, 10)).replace(/-/g, "");
  const tag = [j.project, j.task].filter(Boolean).join("-").replace(/[^\w-]/g, "") || "NOJOB";
  return `${tag}-${form.code}-${d}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
}
function buildRecord(key){
  const form = F(key), d = draft(key), rec = {
    schema: "mx60.fieldtools/2",
    rid: d.rid || makeRid(key),
    app: { name: DATA.app, workingVersion: DATA.version, target: TARGET },
    form: { key: form.key, appendix: form.appendix, name: form.name, kind: form.kind,
            document: form.docName, source: form.source,
            sourceHash: form.sourceHash, workingVersion: DATA.version },
    job: Object.fromEntries(DATA.job.map(j => [j.id, JOBV[j.id] || ""])),
    meta: Object.fromEntries(form.meta.map(m => [m.id, d.meta[m.id] || ""])),
    signedBy: d.sign || "", started: d.started, completedAt: d.completedAt || null,
    device: navigator.userAgent,
    items: [], fields: [], tables: [],
    /* A record is never edited and never deleted. A mistake is corrected by a
       new record that says which one it replaces and why, and a record that
       should not have been made at all is voided with a reason and kept. Both
       still go to the office: "there is no preflight for this task" and "the
       preflight for this task was voided because ..." are different answers. */
    amendment: { supersedes: d.supersedes || null, supersededBy: null,
                 reason: (d.reason || "").trim(), voided: null },
    transfer: { status: "completed", handedAt: null, sentAt: null, how: "" },
  };
  for (const g of form.groups){
    for (const i of (g.items || [])){
      const st = readItem(key, i.id);
      rec.items.push({ id: i.id, group: g.id, groupTitle: g.title, n: i.n,
        text: i.text, sections: i.refs.map(r => (r.doc ? r.doc + " " : "") + "§" + r.n),
        state: st.s || "open", value: st.val || "", note: st.note || "",
        valueLabel: i.field ? i.field.label : "" });
    }
    for (const f of (g.fields || [])){
      rec.fields.push({ id: f.id, group: g.id, groupTitle: g.title, label: f.label,
        required: f.required, fromJob: f.job || "", text: fieldText(key, f) });
    }
    if (g.table){
      const rows = (readTable(key, g.table.id) || [])
        .map(r => g.table.cols.map((c, k) => partText(c.parts[0], r[k] || { v: "", f: "" })))
        .filter(r => r.some(c => c && c !== "—"));
      if (rows.length)
        rec.tables.push({ id: g.table.id, group: g.id, groupTitle: g.title,
                          cols: g.table.cols.map(c => c.name), rows });
    }
  }
  return rec;
}

/* ---- the PDF ------------------------------------------------------------
   A Parametrix record, laid out here rather than photographed off the screen,
   so the text stays selectable and the file stays small. The body face of the
   brand stack resolves to Helvetica, which is what this uses; the slab
   headline face is not embeddable at this size and is not faked. */
const CH = [51, 51, 51], GY = [103, 103, 104], GN = [63, 181, 73],
      RD = [238, 61, 36], RULE = [229, 229, 229];

function makePdf(rec){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4", compress: true });
  const M = 14, R = 210 - M, BOT = 297 - 20, WID = R - M;
  let y = M;

  const set = (style, size, col) => {
    doc.setFont("helvetica", style); doc.setFontSize(size);
    doc.setTextColor(col[0], col[1], col[2]);
  };
  const rule = (col, w) => {
    doc.setDrawColor(col[0], col[1], col[2]); doc.setLineWidth(w || 0.2);
    doc.line(M, y, R, y);
  };
  const need = h => { if (y + h > BOT){ doc.addPage(); y = M } };
  const wrap = (t, w) => doc.splitTextToSize(String(t == null ? "" : t), w);

  // masthead
  const img = "data:image/png;base64," + LOGO;
  try {
    const p = doc.getImageProperties(img), w = 32;
    doc.addImage(img, "PNG", M, y, w, w * p.height / p.width);
  } catch (e) { set("bold", 14, CH); doc.text("Parametrix", M, y + 6) }
  const tx = M + 38;
  set("bold", 7.5, GY);
  doc.text((rec.form.document + " · " + rec.form.appendix).toUpperCase(), tx, y + 3.5,
           { charSpace: 0.3 });
  set("bold", 15, CH); doc.text(rec.form.name, tx, y + 10.5);
  set("bold", 7.5, GY);
  doc.text("TRIMBLE MX60 PREMIUM", tx, y + 15, { charSpace: 0.3 });
  y += 19; rule(GN, 0.7); y += 7;

  for (const [label, text] of amendLines(rec)){
    const lines = doc.splitTextToSize(text, WID - 8);
    const h = lines.length * 4.2 + 9;
    if (y + h > BOT){ doc.addPage(); y = M }
    doc.setFillColor(250, 240, 238);
    doc.setDrawColor(198, 44, 22); doc.setLineWidth(0.3);
    doc.rect(M, y, WID, h, "FD");
    doc.setFillColor(198, 44, 22);
    doc.rect(M, y, 1.4, h, "F");
    set("bold", 7.5, [198, 44, 22]);
    doc.text(label.toUpperCase(), M + 4, y + 4.5, { charSpace: 0.3 });
    set("normal", 9, CH); doc.text(lines, M + 4, y + 9);
    y += h + 5;
  }

  const kv = (k, v) => {
    const lines = wrap(v || "—", WID - 42);
    need(lines.length * 4.4 + 2.5);
    set("bold", 9, CH); doc.text(k, M, y);
    set("normal", 9, CH); doc.text(lines, M + 42, y);
    y += Math.max(1, lines.length) * 4.4 + 1.3;
    rule(RULE, 0.15); y += 2.3;
  };
  const head = t => {
    need(14);
    y += 3.5; set("bold", 8, GY);
    doc.text(String(t).toUpperCase(), M, y, { charSpace: 0.4 });
    y += 1.8; rule(RULE, 0.15); y += 4.2;
  };
  const sub = t => {
    for (const line of wrap(t, WID - 30)){
      need(4.6); set("italic", 8, GY); doc.text(line, M + 30, y); y += 3.8;
    }
    y += 0.6;
  };
  const row = (mark, col, text, extras) => {
    const lines = wrap(text, WID - 30);
    need(lines.length * 4.4 + 2.5);
    set("bold", 8.5, col); doc.text(mark, M, y);
    set("normal", 9, CH); doc.text(lines, M + 30, y);
    y += lines.length * 4.4 + 0.6;
    for (const e of (extras || []).filter(Boolean)) sub(e);
    y += 0.8; rule(RULE, 0.15); y += 2.2;
  };

  kv("Project", rec.job.project);
  kv("Task", rec.job.task);
  kv("Date", rec.job.date);
  kv("Operator", rec.job.operator);
  if (rec.job.vehicle) kv("Vehicle", rec.job.vehicle);
  for (const [k, v] of Object.entries(rec.meta)) if (v) kv(k.replace(/^\w/, c => c.toUpperCase()), v);
  kv("Record", rec.rid);
  kv("Completed", when(rec.completedAt) || "not complete");
  kv("Completed by", rec.signedBy || "—");

  const MARK = { done: ["Cleared", GN], na: ["N/A", GY], open: ["Outstanding", RD] };
  let group = null;
  for (const it of rec.items){
    if (it.group !== group){ head(it.group + " · " + it.groupTitle); group = it.group }
    const [mark, col] = MARK[it.state] || MARK.open;
    row(mark, col, (it.n ? it.n + ". " : "") + it.text, [
      it.value ? (it.valueLabel ? it.valueLabel + ": " : "") + it.value : "",
      it.note ? "Note: " + it.note : "",
      it.sections.length ? it.sections.join(" · ") : "",
    ]);
  }
  group = null;
  for (const f of rec.fields){
    if (f.group !== group){ head(f.group + " · " + f.groupTitle); group = f.group }
    kv(f.label, f.text || (f.required ? "NOT RECORDED" : "—"));
  }
  for (const t of rec.tables){
    head(t.group + " · " + t.groupTitle);
    for (const r of t.rows)
      row("•", CH, t.cols.map((c, k) => c + ": " + (r[k] || "—")).join("   "), []);
  }

  y += 4; need(16);
  set("bold", 9, CH); doc.text("Signed " + (rec.signedBy || "________________"), M, y);
  set("normal", 9, GY);
  doc.text("Transfer: " + transferWords(rec.transfer), M + 70, y);
  y += 6;

  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++){
    doc.setPage(p);
    doc.setDrawColor(RULE[0], RULE[1], RULE[2]); doc.setLineWidth(0.15);
    doc.line(M, 297 - 15, R, 297 - 15);
    set("normal", 7, GY);
    doc.text(`Parametrix · ${DATA.app} · ${rec.form.name} · ${rec.rid}`, M, 297 - 11);
    doc.text(`Page ${p} of ${pages}`, R, 297 - 11, { align: "right" });
    doc.text(`${rec.form.document} ${rec.form.appendix}, Working Version `
      + `${rec.form.workingVersion}, built from ${rec.form.source} `
      + `(${rec.form.sourceHash}). A living draft: nothing here is an adopted `
      + `Parametrix standard.`, M, 297 - 7.5, { maxWidth: WID });
  }
  return doc.output("blob");
}

</script>
<script>
/* ===========================================================================
   The views. One router, five screens: home, the job header, a form, a
   completed record, and the history of records and where each one has got to.
   =========================================================================== */
function go(v){ VIEW = v; MSG = null; opened.clear(); render(); window.scrollTo({ top: 0 }) }

/* ---- the job header, carried into every form --------------------------- */
function jobDone(stage){
  return DATA.job.every(j => (!j.always && stage !== "Field")
    || (JOBV[j.id] || "").trim());
}
function viewJob(){
  const v = document.getElementById("view");
  v.append(E("p", "lead", "Entered once and carried into every form. The project "
    + "and task numbers go on every record, so the office can file it in that "
    + "project's Survey field records folder."));
  const card = E("div", "card");
  card.append(E("h2", null, "<span class=\"gid\">JOB</span><span>This job</span>"));
  const grid = E("div", "jobform");
  for (const j of DATA.job){
    const id = "j-" + j.id, f = E("div", "fld");
    f.append(Object.assign(E("label"), { htmlFor: id,
      innerHTML: esc(j.label) + (j.always ? ' <span class="req">required</span>'
        : ' <span class="hint">field forms</span>') }));
    const inp = Object.assign(document.createElement("input"),
      { id, type: j.type, autocomplete: "off", value: JOBV[j.id] || "" });
    inp.addEventListener("input", () => {
      JOBV[j.id] = inp.value;
      inp.classList.toggle("want", j.always && !inp.value.trim());
      save("job", JOBV);
    });
    if (j.always && !(JOBV[j.id] || "").trim()) inp.classList.add("want");
    f.append(inp);
    grid.append(f);
  }
  card.append(grid);
  v.append(card);
  const a = E("div", "acts");
  const b = E("button", null, "Done");
  b.type = "button"; b.addEventListener("click", () => go({ name: "home" }));
  a.append(b);
  v.append(a);
}

/* ---- home -------------------------------------------------------------- */
function viewHome(){
  const v = document.getElementById("view");
  const pending = INDEX.filter(h => h.status !== "sent").length;

  const jb = E("button", "jobcard");
  jb.type = "button";
  jb.dataset.want = jobDone("Field") ? "0" : "1";
  jb.append(E("div", null,
    '<span class="chip">This job</span>'
    + (jobDone("Field") ? "" : ' <span class="chip open">Needed</span>')));
  const grid = E("div", "jobgrid");
  for (const j of DATA.job){
    const val = (JOBV[j.id] || "").trim();
    grid.append(E("div", null, `<b>${esc(j.label)}</b>`
      + `<span class="${val ? "" : "none"}">${esc(val) || "not set"}</span>`));
  }
  jb.append(grid);
  jb.addEventListener("click", () => go({ name: "job" }));
  v.append(jb);

  for (const stage of ["Field", "Office"]){
    v.append(E("div", "eyebrow", stage === "Field"
      ? "In the vehicle" : "Back at the office"));
    const list = E("div", "formlist");
    for (const form of FORMS.filter(f => f.stage === stage)){
      const p = progress(form.key), on = started(form.key);
      const closed = isClosed(form.key);
      const state = closed || (p.done === p.of && on) ? "completed"
                  : on ? "progress" : "new";
      const b = E("button", "formbtn");
      b.type = "button"; b.dataset.state = state;
      b.append(E("span", "fi", form.code));
      b.append(E("span", "ft", `<b>${esc(form.name)}</b>`
        + `<span>${esc(form.appendix)} · ${esc(form.blurb)}</span>`));
      b.append(E("span", "fs", state === "completed"
        ? `<span class="chip done">${closed ? "Completed" : "Ready"}</span>`
        : state === "progress"
          ? `<span class="chip part">${p.done}/${p.of}</span>`
          : `<span class="chip">${p.of} ${form.kind === "form" ? "required" : "items"}</span>`));
      b.addEventListener("click", () => go({ name: "form", key: form.key }));
      list.append(b);
    }
    v.append(list);
  }

  v.append(E("div", "eyebrow", "Records"));
  const h = E("button", "formbtn");
  h.type = "button";
  h.append(E("span", "fi", "REC"));
  h.append(E("span", "ft", "<b>Record history</b><span>Completed, waiting to be "
    + "sent, and confirmed delivered</span>"));
  h.append(E("span", "fs", pending
    ? `<span class="chip wait">${pending} waiting</span>`
    : `<span class="chip">${INDEX.length} kept</span>`));
  h.addEventListener("click", () => go({ name: "history" }));
  v.append(h);

  if (!STORAGE_OK)
    v.append(E("div", "note caution", "<strong>This browser is not letting the app "
      + "store anything.</strong> Nothing typed here will survive closing the page. "
      + "Check that private browsing is off and that site data is allowed."));
  /* iOS clears the storage of a site it decides is idle, and a record that has
     not reached the office is the one thing here that cannot be recreated. A
     page added to the home screen is treated as installed and is not cleared,
     so this is said plainly rather than left to the manual. */
  else if (navigator.standalone === false)
    v.append(E("div", "note caution", "<strong>Add this to the home screen before "
      + "you rely on it.</strong> Share ▸ Add to Home Screen. Safari clears the "
      + "stored data of a site it decides is idle; a home-screen app is kept, and "
      + "so are the records waiting in it."));
}

function homeHits(q){
  const out = [];
  for (const form of FORMS) for (const g of form.groups){
    for (const i of (g.items || [])){
      const hay = (i.text + " " + g.title + " " + form.name + " "
        + i.refs.map(r => "§" + r.n + " " + r.title).join(" ")).toLowerCase();
      if (hay.includes(q)) out.push({ form, g, label: i.text, el: i.id });
    }
    for (const f of (g.fields || []))
      if ((f.label + " " + g.title + " " + form.name).toLowerCase().includes(q))
        out.push({ form, g, label: f.label, el: f.id });
  }
  return out;
}
function viewHomeSearch(q){
  const v = document.getElementById("view");
  const hits = homeHits(q);
  document.getElementById("qn").textContent = hits.length + " found";
  if (!hits.length){
    v.append(E("div", "empty", "Nothing in the eight forms matches that."));
    return;
  }
  const w = E("div", "hits");
  for (const hit of hits.slice(0, 60)){
    const b = E("button");
    b.type = "button";
    b.append(E("span", "hk", `${hit.form.short} · ${hit.g.id} ${hit.g.title}`));
    b.append(document.createTextNode(hit.label));
    b.addEventListener("click", () =>
      go({ name: "form", key: hit.form.key, focus: hit.el }));
    w.append(b);
  }
  v.append(w);
}

/* ---- a form ------------------------------------------------------------ */
function viewForm(key){
  const form = F(key), v = document.getElementById("view"), d = peek(key);
  if (d && d.supersedes && !d.completedAt)
    v.append(E("div", "band-amend", "<b>Replacement</b>This record will replace "
      + `<code>${esc(d.supersedes)}</code>. Everything from that record has been `
      + "carried over; change what was wrong and say why at the end. The earlier "
      + "record is kept."));
  if (form.intro) v.append(E("p", "lead", form.intro));

  if (form.meta.length){
    const card = E("div", "card");
    card.append(E("h2", null,
      '<span class="gid">ID</span><span>This mission</span>'));
    const grid = E("div", "jobform");
    for (const m of form.meta){
      const id = "m-" + m.id, f = E("div", "fld");
      f.append(Object.assign(E("label"), { htmlFor: id,
        innerHTML: esc(m.label) + ' <span class="req">required</span>' }));
      const inp = Object.assign(document.createElement("input"),
        { id, type: m.type, autocomplete: "off", value: readMeta(key, m.id),
          disabled: isClosed(key) });
      inp.addEventListener("input", () => {
        draft(key).meta[m.id] = inp.value;
        inp.classList.toggle("want", !inp.value.trim());
        saveDrafts(); refreshForm(key);
      });
      f.append(inp);
      grid.append(f);
    }
    card.append(grid);
    v.append(card);
  }

  const groups = E("div"); groups.id = "groups";
  v.append(groups);

  const gate = E("section", "gate"); gate.id = "gate";
  gate.setAttribute("aria-live", "polite");
  gate.append(Object.assign(E("div"), { id: "gatebody" }),
              Object.assign(E("div", "fld sigrow"), { id: "reasonrow" }),
              Object.assign(E("div", "fld sigrow"), { id: "sigrow" }),
              Object.assign(E("div"), { id: "gatefoot" }));
  v.append(gate);

  buildGroups(key);
  buildReason(key);
  buildSign(key);
  buildGate(key);
  filterForm();
}

function buildGroups(key){
  const form = F(key), w = document.getElementById("groups");
  w.textContent = "";
  for (const g of form.groups){
    const sec = E("section", "grp");
    sec.id = g.id + "-sec";
    const h = E("h2");
    h.append(E("span", "gid", g.id), E("span", "gt", esc(g.title)), E("span", "gn", ""));
    sec.append(h);
    if (g.pointer) sec.append(E("div", "note", g.pointer));
    if (g.note)
      sec.append(E("div", "note" + (/CAUTION|WARNING/.test(g.note) ? " caution" : ""),
                   g.note));
    for (const i of (g.items || [])) sec.append(buildRow(key, i));
    for (const f of (g.fields || [])) sec.append(buildField(key, f));
    if (g.table) sec.append(buildTable(key, g.table));
    w.append(sec);
  }
}

function buildRow(key, i){
  const st = readItem(key, i.id), locked = isClosed(key);
  const wrap = E("div", "itemwrap");
  const row = E("div", "item"); row.id = i.id; row.dataset.s = st.s || "open";

  const tick = E("button", "tick");
  tick.type = "button"; tick.disabled = locked;
  tick.setAttribute("role", "checkbox");
  tick.setAttribute("aria-checked",
    st.s === "done" ? "true" : st.s === "na" ? "mixed" : "false");
  tick.append(E("span", "box", st.s === "na" ? "N/A" : "&#10003;"));
  const txt = E("div", "txt");
  txt.append(E("span", "t", (i.n ? `<span class="num">${esc(i.n)}</span> ` : "") + i.html));
  for (const s of i.sub)
    txt.append(E("span", "sub", `<b>${esc(s.label)}</b> ${s.html}`));
  if (i.refs.length)
    txt.append(E("span", "refs", i.refs.map(r =>
      `<b>${r.doc ? esc(r.doc) + " " : ""}&sect;${r.n}</b> ${esc(r.title)}`)
      .join(" &middot; ")));
  if (i.field) txt.append(E("span", "needval", i.field.label + " still to record"));
  tick.append(txt);
  tick.addEventListener("click", () => {
    const s = itemState(key, i.id);
    s.s = s.s === "done" ? "" : "done";
    saveDrafts(); rebuildForm(key);
    if (s.s === "done" && i.field && !(s.val || "").trim())
      document.getElementById(i.id + "-val")?.focus();
  });
  row.append(tick);

  const side = E("div", "side");
  if (i.na){
    const na = E("button", null, "N/A");
    na.type = "button"; na.disabled = locked;
    na.title = "The document makes this item conditional";
    na.setAttribute("aria-pressed", st.s === "na" ? "true" : "false");
    na.addEventListener("click", () => {
      const s = itemState(key, i.id);
      s.s = s.s === "na" ? "" : "na"; saveDrafts(); rebuildForm(key);
    });
    side.append(na);
  }
  const nb = E("button", null, st.note ? "&#9679;" : "&#43;");
  nb.type = "button"; nb.disabled = locked;
  nb.setAttribute("aria-label", "Note on " + i.id);
  nb.setAttribute("aria-pressed", opened.has(i.id) ? "true" : "false");
  nb.addEventListener("click", () => {
    opened.has(i.id) ? opened.delete(i.id) : opened.add(i.id);
    rebuildForm(key);
    document.getElementById(i.id + "-note")?.focus();
  });
  side.append(nb);
  row.append(side);
  wrap.append(row);

  /* A value-bearing item always shows its field: its own text asks for a
     value, so hiding it behind a tap would hide the requirement. */
  const ex = E("div", "extra");
  ex.hidden = !i.field && !opened.has(i.id) && !st.note;
  if (i.field){
    const id = i.id + "-val";
    ex.append(Object.assign(E("label"), { htmlFor: id, textContent: i.field.label }));
    const inp = Object.assign(document.createElement("input"),
      { id, type: i.field.type, value: st.val || "", autocomplete: "off",
        disabled: locked });
    inp.addEventListener("input", () => {
      itemState(key, i.id).val = inp.value;   // the row is not rebuilt here:
      saveDrafts();                            // that would take the focus out
      markRow(key, i, row, inp);
      refreshForm(key);
    });
    ex.append(inp);
  }
  if (opened.has(i.id) || st.note){
    const nid = i.id + "-note";
    ex.append(Object.assign(E("label"), { htmlFor: nid, textContent: "Note" }));
    const ta = Object.assign(document.createElement("textarea"),
      { id: nid, value: st.note || "", rows: 2, disabled: locked });
    ta.addEventListener("input", () => { itemState(key, i.id).note = ta.value; saveDrafts() });
    ex.append(ta);
  }
  wrap.append(ex);
  markRow(key, i, row, ex.querySelector("input"));
  return wrap;
}
function markRow(key, i, row, input){
  if (!i.field) return;
  const st = readItem(key, i.id);
  const want = st.s === "done" && !(st.val || "").trim();
  row.querySelector(".needval").hidden = !want;
  if (input) input.classList.toggle("need", want);
}

/* ---- a record-form field ----------------------------------------------- */
function buildPart(key, fid, k, part, locked, onchange){
  const st = fieldState(key, fid), box = E("div", "part");  // written to by its handlers
  if (part.label && part.kind !== "check") box.append(E("div", "flab", esc(part.label)));
  if (part.kind === "text"){
    const inp = Object.assign(document.createElement("input"),
      { id: `${fid}-${k}`, type: "text", autocomplete: "off",
        value: st.v[k] || "", disabled: locked,
        placeholder: part.hint ? part.hint : "" });
    inp.addEventListener("input", () => { st.v[k] = inp.value; onchange(inp) });
    box.append(inp);
    if (part.hint) box.append(E("div", "hint", esc(part.hint)));
  } else if (part.kind === "check"){
    const b = E("button", "checkbtn");
    b.type = "button"; b.disabled = locked;
    b.setAttribute("aria-pressed", st.v[k] === true ? "true" : "false");
    b.append(E("span", "box", "&#10003;"),
             E("span", null, esc(part.label || "Confirmed")));
    b.addEventListener("click", () => { st.v[k] = !st.v[k]; onchange(null) });
    box.append(b);
  } else {
    const picks = E("div", "picks");
    part.options.forEach((o, oi) => {
      const b = E("button", "pick", o.html);
      b.type = "button"; b.disabled = locked;
      b.setAttribute("aria-pressed", st.v[k] === oi ? "true" : "false");
      b.addEventListener("click", () => {
        st.v[k] = st.v[k] === oi ? "" : oi; onchange(null);
      });
      picks.append(b);
    });
    box.append(picks);
    const chosen = part.options[st.v[k]];
    if (chosen && chosen.follow){
      const id = `${fid}-${k}-f`;
      box.append(Object.assign(E("label", "flab"),
        { htmlFor: id, textContent: chosen.follow }));
      const inp = Object.assign(document.createElement("input"),
        { id, type: "text", autocomplete: "off", value: st.f[k] || "", disabled: locked });
      inp.addEventListener("input", () => { st.f[k] = inp.value; onchange(inp) });
      box.append(inp);
    }
  }
  return box;
}
function buildField(key, f){
  const locked = isClosed(key);
  const w = E("div", "rowfld"); w.id = f.id;
  w.append(E("div", "flab", f.labelHtml
    + (f.required ? ' <span class="req">required</span>' : "")));
  if (f.job){
    const val = (JOBV[f.job] || "").trim();
    w.dataset.done = val ? "1" : "0";
    w.append(E("div", "carried", val ? esc(val) : "not set yet"));
    if (val){
      w.append(E("div", "fromjob", "Carried from the job header"));
    } else {
      const b = E("button", "fromjob");
      b.type = "button"; b.textContent = "Set it in the job header";
      b.style.cssText = "text-align:left;text-decoration:underline;min-height:40px";
      b.addEventListener("click", () => go({ name: "job" }));
      w.append(b);
    }
    return w;
  }
  const onchange = inp => {
    saveDrafts();
    if (inp) { markField(key, f, w); refreshForm(key) }
    else rebuildForm(key);
  };
  f.parts.forEach((p, k) => w.append(buildPart(key, f.id, k, p, locked, onchange)));
  markField(key, f, w);
  return w;
}
function markField(key, f, w){
  if (!f.required) return;
  const done = fieldDone(key, f);
  w.dataset.done = done ? "1" : "0";
  w.querySelectorAll("input").forEach(i => i.classList.remove("want"));
  if (!done) w.querySelector("input")?.classList.add("want");
}

/* ---- a repeating table -------------------------------------------------- */
function buildTable(key, t){
  const rows = tableState(key, t), locked = isClosed(key);
  const w = E("div", "tbl"); w.id = t.id;
  rows.forEach((r, ri) => {
    const box = E("div", "trow");
    const rn = E("div", "rn");
    rn.append(E("span", null, `${esc(t.cols[0].name)} ${ri + 1}`));
    if (!locked && rows.length > 1){
      const rm = E("button", null, "Remove");
      rm.type = "button";
      rm.addEventListener("click", () => { rows.splice(ri, 1); saveDrafts(); rebuildForm(key) });
      rn.append(rm);
    }
    box.append(rn);
    t.cols.forEach((c, ci) => {
      const cell = E("div", "cell");
      cell.append(E("div", "flab", esc(c.name)));
      const part = c.parts[0];
      const val = (r[ci] = r[ci] || { v: "", f: "" });
      if (part.kind === "choice"){
        const picks = E("div", "picks");
        part.options.forEach((o, oi) => {
          const b = E("button", "pick", o.html);
          b.type = "button"; b.disabled = locked;
          b.setAttribute("aria-pressed", val.v === oi ? "true" : "false");
          b.addEventListener("click", () => {
            val.v = val.v === oi ? "" : oi; saveDrafts(); rebuildForm(key);
          });
          picks.append(b);
        });
        cell.append(picks);
      } else {
        const inp = Object.assign(document.createElement("input"),
          { type: "text", autocomplete: "off", value: val.v || "", disabled: locked });
        inp.addEventListener("input", () => { val.v = inp.value; saveDrafts() });
        cell.append(inp);
      }
      box.append(cell);
    });
    w.append(box);
  });
  if (!locked){
    const add = E("button", "addrow", "Add a row");
    add.type = "button";
    add.addEventListener("click", () => {
      rows.push(t.cols.map(() => ({ v: "", f: "" })));
      saveDrafts(); rebuildForm(key);
    });
    w.append(add);
  }
  return w;
}
</script>
<script>
/* ---- the signature. It sits at the end, because signing is what follows the
   work, not something to get out of the way first. Built once so a name can be
   typed into it without the gate rebuilding underneath. ------------------- */
function buildSign(key){
  const form = F(key), w = document.getElementById("sigrow");
  w.textContent = "";
  if (!form.sign){ w.hidden = true; return }
  w.append(Object.assign(E("label"), { htmlFor: "m-sign", textContent: form.sign }));
  const inp = Object.assign(document.createElement("input"),
    { id: "m-sign", type: "text", autocomplete: "off", value: readSign(key),
      placeholder: "Your name" });
  inp.addEventListener("input", () => {
    draft(key).sign = inp.value;
    inp.classList.toggle("want", !inp.value.trim());
    saveDrafts(); refreshForm(key);
  });
  w.append(inp);
}

/* Built once, beside the signature, for the same reason: a field the gate is
   waiting for cannot be rebuilt on every keystroke. */
function buildReason(key){
  const w = document.getElementById("reasonrow"), d = peek(key);
  w.textContent = "";
  if (!d || !d.supersedes){ w.hidden = true; return }
  w.hidden = false;
  w.append(Object.assign(E("label"),
    { htmlFor: "m-reason", textContent: "Why this replaces " + d.supersedes }));
  const inp = Object.assign(document.createElement("input"),
    { id: "m-reason", type: "text", autocomplete: "off", value: d.reason || "",
      placeholder: "What was wrong with the earlier record" });
  inp.addEventListener("input", () => {
    draft(key).reason = inp.value;
    inp.classList.toggle("want", !inp.value.trim());
    saveDrafts(); refreshForm(key);
  });
  w.append(inp);
}

function paintGroupTotals(key){
  const form = F(key);
  for (const g of form.groups){
    const sec = document.getElementById(g.id + "-sec");
    if (!sec) continue;
    const items = g.items || [], fields = (g.fields || []).filter(f => f.required);
    const of = items.length || fields.length;
    const d = items.length ? items.filter(i => CLEARED(readItem(key, i.id).s)).length
                           : fields.filter(f => fieldDone(key, f)).length;
    sec.dataset.done = of && d === of ? "1" : "0";
    sec.querySelector(".gn").textContent = of ? d + "/" + of : "";
  }
  const p = progress(key);
  document.getElementById("tally").textContent = p.done + "/" + p.of;
  const meter = document.getElementById("meter");
  meter.textContent = "";
  for (const g of form.groups){
    const items = g.items || [], fields = (g.fields || []).filter(f => f.required);
    const of = items.length || fields.length;
    if (!of) continue;
    const d = items.length ? items.filter(i => CLEARED(readItem(key, i.id).s)).length
                           : fields.filter(f => fieldDone(key, f)).length;
    const bar = E("i");
    bar.className = d === of ? "on" : d ? "part" : "";
    meter.append(bar);
  }
}

/* ---- the gate ----------------------------------------------------------- */
function buildGate(key){
  const form = F(key), d = peek(key) || {}, o = outstanding(key);
  const g = document.getElementById("gate"), b = document.getElementById("gatebody"),
        f = document.getElementById("gatefoot"), ready = o.length === 0,
        locked = Boolean(d.completedAt);
  g.dataset.ready = ready || locked ? "1" : "0";
  b.textContent = ""; f.textContent = "";
  document.getElementById("sigrow").hidden = locked || !form.sign;
  document.getElementById("reasonrow").hidden = locked || !d.supersedes;

  if (locked){
    const c = E("div", "cleared");
    c.append(E("span", "dot"), document.createTextNode(
      form.kind === "checklist" ? "Checklist complete · " + when(d.completedAt)
                                : "Record complete · " + when(d.completedAt)
      + (d.sign ? " · " + d.sign : "")));
    b.append(c);
    b.append(E("h2", null, form.stage === "Field" && form.key === "preflight"
      ? "Cleared to start the mission" : "Record closed"));
    b.append(E("p", null, "It is read-only and kept on this tablet. Open it from "
      + "Record history to print it, send it, or check where it has got to. "
      + "Starting a new one leaves this record untouched."));
    const a = E("div", "acts");
    const open = E("button", null, "Open the record");
    open.type = "button";
    open.addEventListener("click", () => go({ name: "record", rid: d.rid }));
    a.append(open);
    const nw = E("button", "quiet", "Start a new one");
    nw.type = "button";
    nw.addEventListener("click", () => {
      if (nw.dataset.sure !== "1"){
        nw.dataset.sure = "1"; nw.textContent = "Tap again to start a new one"; return;
      }
      delete DRAFTS[key]; saveDrafts(); go({ name: "form", key });
    });
    a.append(nw);
    b.append(a);
    f.append(said());
    return;
  }

  b.append(E("h2", null, ready ? "Everything is done — confirm it"
    : o.length + " outstanding"));
  b.append(E("p", null, ready
    ? "Confirm to close the record. After that it is read-only, a Parametrix PDF "
      + "is written for it, and it is kept here until the office has it."
    : (form.kind === "checklist"
        ? "This checklist is not complete until every item is ticked or marked N/A"
        : "This record is not complete until every required field is filled in")
      + (form.sign ? ", the job header is filled in and it is signed." : ".")
      + " Tap one to go to it."));
  if (o.length){
    const ul = E("ul", "out");
    for (const x of o){
      const li = E("li"), bt = E("button");
      bt.type = "button";
      bt.append(E("span", "oid", x.k), document.createTextNode(x.why));
      bt.addEventListener("click", () => {
        if (x.go === "job") return go({ name: "job" });
        const el = document.getElementById(x.el);
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        (el.querySelector(".tick") || el.querySelector("input,button") || el).focus();
      });
      li.append(bt); ul.append(li);
    }
    b.append(ul);
  }
  const btn = E("button", "go", form.kind === "checklist"
    ? "Confirm checklist complete" : "Confirm record complete");
  btn.type = "button"; btn.disabled = !ready;
  btn.addEventListener("click", () => complete(key, btn));
  f.append(btn, said());
}

function said(){
  const d = E("div", "said" + (MSG && MSG.bad ? " bad" : ""));
  const pending = INDEX.filter(h => h.status !== "sent").length;
  d.textContent = MSG ? MSG.t
    : pending ? pending + " record" + (pending === 1 ? "" : "s") + " waiting for the office."
              : "No records waiting.";
  if (!navigator.onLine) d.append(E("span", "offline", "offline"));
  return d;
}

/* ---- completing a form -------------------------------------------------- */
async function complete(key, btn){
  if (outstanding(key).length) return;
  const d = draft(key);
  if (btn){ btn.disabled = true; btn.textContent = "Writing the record…" }
  d.rid = d.rid || makeRid(key);
  d.completedAt = new Date().toISOString();
  saveDrafts();
  const rec = buildRecord(key);
  let pdf = null;
  try { pdf = makePdf(rec) } catch (e) { MSG = { t: "The record is saved, but the PDF "
    + "could not be written: " + e.message, bad: true } }
  /* The draft is kept beside the record, locally only. It is what a
     replacement is built from, so a record can be corrected months later
     without re-ticking everything, and it is never sent anywhere. */
  await Store.put({ rid: rec.rid, formKey: key, status: "completed",
    completedAt: d.completedAt, job: rec.job, record: rec, pdf,
    draft: JSON.parse(JSON.stringify(d)) });
  if (d.supersedes){
    const old = await Store.get(d.supersedes);
    if (old && old.record){
      old.record.amendment = old.record.amendment || {};
      old.record.amendment.supersededBy = rec.rid;
      old.supersededBy = rec.rid;
      await Store.put(old);
    }
  }
  go({ name: "record", rid: rec.rid });
}
