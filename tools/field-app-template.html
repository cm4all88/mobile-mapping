/* ---- one completed record ---------------------------------------------- */
let CURRENT = null;
async function viewRecord(rid){
  const v = document.getElementById("view");
  const entry = await Store.get(rid);
  if (!entry || !entry.record){
    v.append(E("div", "empty", "That record is not on this tablet."));
    return;
  }
  CURRENT = entry;
  const rec = entry.record;
  rec.transfer = { status: entry.status, handedAt: entry.handedAt || null,
                   sentAt: entry.sentAt || null, how: entry.how || "" };
  rec.amendment = rec.amendment || { supersedes: null, supersededBy: null,
                                     reason: "", voided: null };
  rec.amendment.supersededBy = entry.supersededBy || rec.amendment.supersededBy;
  rec.amendment.voided = entry.voided || rec.amendment.voided;
  document.getElementById("rec").innerHTML = recSheet(rec);
  for (const line of amendLines(rec))
    v.append(E("div", "band-amend", `<b>${esc(line[0])}</b>${esc(line[1])}`));

  const card = E("div", "card");
  card.append(E("h2", null,
    `<span class="gid">${esc(F(entry.formKey).code)}</span>`
    + `<span>${esc(rec.form.name)}</span>`
    + `<span class="gn">${chipFor(entry.status, entry)}</span>`));
  const tbl = E("div", "jobform");
  const row = (k, val) => tbl.append(E("div", "fld",
    `<span class="flab">${esc(k)}</span><div class="carried">${esc(val) || "&mdash;"}</div>`));
  row("Project", rec.job.project); row("Task", rec.job.task);
  row("Date", rec.job.date); row("Operator", rec.job.operator);
  if (rec.job.vehicle) row("Vehicle", rec.job.vehicle);
  for (const [k, val] of Object.entries(rec.meta)) if (val) row(k, val);
  row("Record", rec.rid);
  row("Completed", when(rec.completedAt));
  row("Completed by", rec.signedBy);
  row("Transfer", transferWords(rec.transfer));
  card.append(tbl);
  v.append(card);

  const a = E("div", "acts");
  if (TARGET === "file"){
    const p = E("button", null, "Print");
    p.type = "button"; p.addEventListener("click", () => window.print());
    a.append(p);
  }
  const sh = E("button", null, "Send to the office");
  sh.type = "button"; sh.addEventListener("click", () => sendRecord(entry, sh));
  a.append(sh);
  if (TARGET === "file"){
    const sv = E("button", "quiet", "Save the PDF");
    sv.type = "button"; sv.addEventListener("click", () => savePdf(entry));
    a.append(sv);
  }
  const show = E("button", "quiet", "Show the record");
  show.type = "button";
  show.addEventListener("click", () => {
    const r = document.getElementById("rec");
    r.hidden = !r.hidden;
    if (!r.hidden) r.scrollIntoView({ behavior: "smooth" });
  });
  a.append(show);
  if (!entry.voided){
    const rp = E("button", "quiet", "Replace this record");
    rp.type = "button";
    rp.addEventListener("click", () => replaceRecord(entry));
    a.append(rp);
    const vd = E("button", "danger", "Void this record");
    vd.type = "button";
    vd.addEventListener("click", () => {
      const box = document.getElementById("voidbox");
      box.hidden = !box.hidden;
      if (!box.hidden) box.querySelector("input").focus();
    });
    a.append(vd);
  }
  if (entry.status !== "sent"){
    const ok = E("button", "quiet", "The office has it");
    ok.type = "button";
    ok.addEventListener("click", async () => {
      if (ok.dataset.sure !== "1"){
        ok.dataset.sure = "1"; ok.textContent = "Tap again to confirm delivery"; return;
      }
      await mark(entry, "sent", "confirmed by the operator");
      MSG = { t: "Marked as delivered." };
      go({ name: "record", rid });
    });
    a.append(ok);
  } else {
    const del = E("button", "danger", "Delete this record");
    del.type = "button";
    del.addEventListener("click", async () => {
      if (del.dataset.sure !== "1"){
        del.dataset.sure = "1"; del.textContent = "Tap again to delete"; return;
      }
      await Store.remove(rid);
      MSG = { t: "Deleted. Only a record the office has can be deleted." };
      go({ name: "history" });
    });
    a.append(del);
  }
  v.append(a);

  /* Voiding asks for a reason and will not proceed without one. The record is
     kept, re-rendered with the void on it, and still has to reach the office. */
  const box = E("div", "card"); box.id = "voidbox"; box.hidden = true;
  box.append(E("h2", null,
    '<span class="gid">VOID</span><span>Void this record</span>'));
  const vf = E("div", "jobform");
  const vfld = E("div", "fld");
  vfld.append(Object.assign(E("label"),
    { htmlFor: "voidwhy", textContent: "Why it should not count" }));
  const vin = Object.assign(document.createElement("input"),
    { id: "voidwhy", type: "text", autocomplete: "off",
      placeholder: "What was wrong with it" });
  vfld.append(vin);
  vf.append(vfld);
  box.append(vf);
  const vgo = E("button", "go", "Void it");
  vgo.type = "button"; vgo.disabled = true;
  vgo.style.cssText = "margin:0 14px 14px;width:calc(100% - 28px);background:var(--open)";
  vin.addEventListener("input", () => { vgo.disabled = !vin.value.trim() });
  vgo.addEventListener("click", async () => {
    if (!vin.value.trim()) return;
    vgo.disabled = true;
    await voidRecord(entry, vin.value);
    MSG = { t: "Voided. It is kept, and it still has to reach the office." };
    go({ name: "record", rid });
  });
  box.append(vgo);
  v.append(box);

  v.append(said());
  v.append(E("div", "note", TARGET === "file"
    ? "<strong>Print</strong> opens the iPad print sheet on the record above; "
      + "pinch out on the preview to save it to Files as a PDF. "
      + "<strong>Send to the office</strong> hands the PDF and the JSON to the share "
      + "sheet. Nothing is marked delivered until you say the office has it."
    : "<strong>This is the review copy.</strong> It cannot print and it will not open "
      + "without a signal. The file in <code>field-app/</code> does both."));
}
const transferChip = s => s === "sent" ? '<span class="chip sent">Delivered</span>'
  : s === "handed" ? '<span class="chip moving">Handed over</span>'
  : '<span class="chip wait">Waiting to send</span>';
/* A void or a replacement is not a transfer state: a voided record still has to
   reach the office. Both are shown beside the transfer chip, never instead. */
const chipFor = (s, e) => transferChip(s)
  + (e && e.voided ? ' <span class="chip void">Voided</span>' : "")
  + (e && e.supersededBy ? ' <span class="chip super">Replaced</span>' : "")
  + (e && e.record && e.record.amendment && e.record.amendment.supersedes
      ? ' <span class="chip super">Replacement</span>' : "");

/* The one place that words an amendment, so the screen, the printed sheet and
   the PDF all say the same thing. */


/* ---- history ------------------------------------------------------------ */
async function viewHistory(){
  const v = document.getElementById("view");
  const all = (await Store.all()).slice()
    .sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
  v.append(E("p", "lead", "Every record completed on this tablet. A record is kept "
    + "until the office is confirmed to have it, and nothing here is ever removed "
    + "on its own."));
  const buckets = [
    ["Waiting to send", all.filter(r => r.status === "completed")],
    ["Handed over, not confirmed", all.filter(r => r.status === "handed")],
    ["Delivered", all.filter(r => r.status === "sent")],
  ];
  for (const [name, rows] of buckets){
    v.append(E("div", "eyebrow", `${name} (${rows.length})`));
    if (!rows.length){ v.append(E("div", "empty", "None.")); continue }
    const list = E("div", "recs");
    for (const r of rows){
      const form = F(r.formKey) || { name: r.formKey, code: "??" };
      const b = E("button", "recbtn");
      b.type = "button";
      b.append(E("span", "fi", esc(form.code)));
      b.append(E("span", "rt", `<b>${esc(form.name)}</b>`
        + `<span>${esc([r.job.project, r.job.task].filter(Boolean).join(" · ") || "no job")}`
        + ` &middot; ${esc(r.job.operator || "")} &middot; ${esc(when(r.completedAt))}</span>`
        + `<span>${esc(r.rid)}</span>`));
      b.append(E("span", "fs", chipFor(r.status, r)));
      b.addEventListener("click", () => go({ name: "record", rid: r.rid }));
      list.append(b);
    }
    v.append(list);
  }
  if (SUBMIT_URL){
    const a = E("div", "acts");
    const s = E("button", null, "Send everything waiting");
    s.type = "button"; s.addEventListener("click", () => flush(true));
    a.append(s);
    v.append(a);
  }
  v.append(said());
}

/* ---- correcting a record ------------------------------------------------
   Neither of these touches the record being corrected: it keeps its own
   history, its PDF and its place in the transfer queue. A voided record still
   goes to the office, because "voided because the wrong vehicle was on it" is
   an answer the office needs and an absence is not. */
async function voidRecord(entry, reason){
  entry.voided = { at: new Date().toISOString(), reason: reason.trim(),
                   by: (entry.record && entry.record.signedBy) || "" };
  if (entry.record){
    entry.record.amendment = entry.record.amendment || {};
    entry.record.amendment.voided = entry.voided;
  }
  entry.pdf = null;                       // rewritten with the void on it
  await Store.put(entry);
  try { await pdfOf(entry) } catch (e) { /* the record stands without it */ }
  if (peek(entry.formKey) && peek(entry.formKey).rid === entry.rid){
    delete DRAFTS[entry.formKey]; saveDrafts();
  }
}
async function replaceRecord(entry){
  const key = entry.formKey;
  const base = entry.draft ? JSON.parse(JSON.stringify(entry.draft)) : null;
  DRAFTS[key] = base
    ? { items: base.items || {}, fields: base.fields || {}, tables: base.tables || {},
        meta: base.meta || {}, sign: base.sign || "",
        started: new Date().toISOString(), supersedes: entry.rid, reason: "" }
    : { items: {}, fields: {}, tables: {}, meta: {}, sign: "",
        started: new Date().toISOString(), supersedes: entry.rid, reason: "" };
  saveDrafts();
  go({ name: "form", key });
}

/* ---- getting a record to the office ------------------------------------- */
async function mark(entry, status, how){
  const now = new Date().toISOString();
  entry.status = status;
  if (status === "handed") entry.handedAt = now;
  if (status === "sent") entry.sentAt = now;
  entry.how = how;
  if (entry.record)
    entry.record.transfer = { status, handedAt: entry.handedAt || null,
                              sentAt: entry.sentAt || null, how };
  await Store.put(entry);
}
async function pdfOf(entry){
  if (entry.pdf) return entry.pdf;
  const pdf = makePdf(entry.record);
  entry.pdf = pdf;
  await Store.put(entry);
  return pdf;
}
function fileNames(entry){
  const base = entry.rid + "-" + F(entry.formKey).code;
  return { pdf: base + ".pdf", json: base + ".json" };
}
async function savePdf(entry){
  try {
    const blob = await pdfOf(entry), n = fileNames(entry).pdf;
    const a = Object.assign(document.createElement("a"),
      { href: URL.createObjectURL(blob), download: n });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    MSG = { t: "Saved " + n + "." };
  } catch (e) { MSG = { t: "Could not write the PDF: " + e.message, bad: true } }
  render();
}
async function post(rec){
  if (!SUBMIT_URL) throw new Error("no office endpoint is set");
  const r = await fetch(SUBMIT_URL, { method: "POST",
    headers: { "content-type": "application/json" }, body: JSON.stringify(rec) });
  if (!r.ok) throw new Error("the office returned " + r.status);
}
async function sendRecord(entry, btn){
  MSG = null;
  if (btn) btn.disabled = true;
  try {
    if (SUBMIT_URL && navigator.onLine){
      try {
        await post(entry.record);
        await mark(entry, "sent", "posted to the office");
        MSG = { t: "Delivered to the office." };
        return go({ name: "record", rid: entry.rid });
      } catch (e) {
        MSG = { t: "Could not reach the office — " + e.message
                   + ". The record is kept here and goes when there is a signal.",
                bad: true };
      }
    }
    const n = fileNames(entry);
    const files = [];
    try { files.push(new File([await pdfOf(entry)], n.pdf, { type: "application/pdf" })) }
    catch (e) { /* the JSON still goes */ }
    files.push(new File([JSON.stringify(entry.record, null, 2)], n.json,
                        { type: "application/json" }));
    if (navigator.canShare && navigator.canShare({ files })){
      try {
        await navigator.share({ files, title: entry.rid });
        /* A share sheet opening is not a delivery. The record is marked handed
           over, and stays on the tablet until someone confirms it arrived. */
        await mark(entry, "handed", "iPad share sheet");
        MSG = { t: "Handed to the share sheet. It is not counted as delivered until "
                   + "you confirm the office has it." };
        return go({ name: "record", rid: entry.rid });
      } catch (e) { MSG = { t: "Nothing was sent." } }
    } else if (TARGET === "file"){
      await savePdf(entry);
      MSG = { t: "This browser has no share sheet. The PDF is saved; send it on "
                 + "from Files." };
    } else {
      /* the artifact frame grants a page no download at all */
      MSG = { t: "The review copy cannot hand over a file. Use the file in "
                 + "field-app/ on the tablet.", bad: true };
    }
  } finally {
    if (btn) btn.disabled = false;
    render();
  }
}
async function flush(loud){
  if (!SUBMIT_URL || !navigator.onLine) return;
  const all = await Store.all();
  let sent = 0;
  for (const entry of all.filter(r => r.status !== "sent" && r.record)){
    try { await post(entry.record); await mark(entry, "sent", "posted to the office"); sent++ }
    catch (e) { /* it stays here; nothing is lost */ }
  }
  if (sent || loud){
    MSG = { t: sent ? sent + " record" + (sent === 1 ? "" : "s") + " delivered."
                    : "Nothing could be delivered right now." };
    render();
  }
}

/* ---- search ------------------------------------------------------------- */
function filterForm(){
  if (VIEW.name !== "form") return;
  const form = F(VIEW.key);
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  let n = 0, total = 0;
  for (const g of form.groups){
    let any = 0;
    for (const i of (g.items || [])){
      total++;
      const hay = (i.text + " " + g.id + " " + g.title + " "
        + i.sub.map(s => s.label + " " + s.html).join(" ") + " "
        + i.refs.map(r => "§" + r.n + " " + r.title).join(" ")).toLowerCase();
      const hit = !q || hay.includes(q);
      document.getElementById(i.id)?.closest(".itemwrap")?.toggleAttribute("hidden", !hit);
      if (hit){ any++; n++ }
    }
    for (const f of (g.fields || [])){
      total++;
      const hit = !q || (f.label + " " + g.id + " " + g.title).toLowerCase().includes(q);
      const el = document.getElementById(f.id);
      if (el) el.hidden = !hit;
      if (hit){ any++; n++ }
    }
    if (g.table && !q) any++;
    else if (g.table) document.getElementById(g.table.id)?.toggleAttribute("hidden", Boolean(q));
    const sec = document.getElementById(g.id + "-sec");
    if (sec) sec.hidden = Boolean(q) && !any;
  }
  document.getElementById("qn").textContent =
    q ? n + " of " + total : total + (form.kind === "form" ? " fields" : " items");
}

/* ---- the two repaints within a form ------------------------------------- */
function refreshForm(key){
  paintGroupTotals(key); buildGate(key);
}
function rebuildForm(key){
  buildGroups(key); refreshForm(key); filterForm();
}

/* ---- the router --------------------------------------------------------- */
function render(){
  const v = document.getElementById("view");
  v.textContent = "";
  const bt = document.getElementById("bt"), bs = document.getElementById("bs"),
        act = document.getElementById("bact"), find = document.getElementById("find"),
        meter = document.getElementById("meter"), q = document.getElementById("q");
  act.textContent = ""; meter.textContent = "";
  document.getElementById("rec").hidden = true;

  const home = () => { const b = E("button", null, "Home"); b.type = "button";
    b.addEventListener("click", () => go({ name: "home" })); return b };

  if (VIEW.name === "home"){
    bt.textContent = DATA.app; bs.textContent = "Trimble MX60 Premium";
    find.hidden = false; find.className = "find";
    q.placeholder = "Search all eight forms";
    act.append(Object.assign(E("span", "tally"),
      { innerHTML: `<b>${FORMS.length}</b><span>forms</span>` }));
    const term = (q.value || "").trim().toLowerCase();
    if (term) viewHomeSearch(term); else { viewHome(); document.getElementById("qn").textContent = "" }
  } else if (VIEW.name === "job"){
    bt.textContent = "This job"; bs.textContent = "Carried into every form";
    find.hidden = true; act.append(home());
    viewJob();
  } else if (VIEW.name === "form"){
    const form = F(VIEW.key);
    bt.textContent = form.name;
    bs.textContent = form.docName + " · " + form.appendix;
    find.hidden = false; find.className = "find";
    q.placeholder = "Search this form";
    act.append(Object.assign(E("span", "tally"),
      { innerHTML: '<b id="tally">0/0</b><span>done</span>' }), home());
    viewForm(VIEW.key);
    paintGroupTotals(VIEW.key);
    if (VIEW.focus) setTimeout(() => {
      const el = document.getElementById(VIEW.focus);
      el?.scrollIntoView({ block: "center" });
      el?.classList.add("hit");
    }, 40);
  } else if (VIEW.name === "record"){
    bt.textContent = "Record"; bs.textContent = VIEW.rid;
    find.hidden = true;
    const b = E("button", null, "History"); b.type = "button";
    b.addEventListener("click", () => go({ name: "history" }));
    act.append(b, home());
    viewRecord(VIEW.rid);
  } else {
    bt.textContent = "Record history";
    bs.textContent = INDEX.length + " on this tablet";
    find.hidden = true; act.append(home());
    viewHistory();
  }
  prov();
}

function prov(){
  const srcs = FORMS.map(f => `${f.appendix} ${f.name}`).join(", ");
  document.getElementById("prov").innerHTML =
    `<b>${esc(DATA.app)}</b> &mdash; ${FORMS.length} forms built from the Field How To `
    + `and the Office How To, Working Version ${esc(DATA.version)}. Each record carries `
    + `the hash of the appendix it was built from.<br>`
    + (TARGET === "file"
        ? "This file carries everything it needs and works with no signal. Add it to the "
          + "home screen from Safari so the iPad keeps what you enter. Records stay on "
          + "this tablet until the office is confirmed to have them."
        : "This is the review copy, fetched over the network. It cannot print and it will "
          + "not open without a signal — the file in <code>field-app/</code> does both.")
    + "<br>A living draft. Nothing here is an adopted Parametrix standard, and nothing in "
    + "it may be quoted to a client as one.";
}

document.getElementById("q").addEventListener("input",
  () => { VIEW.name === "form" ? filterForm() : render() });
window.addEventListener("online", () => { MSG = null; render(); flush() });
window.addEventListener("offline", () => { MSG = null; render() });

/* Ask the browser to keep this data. iOS clears storage for a site it decides
   is idle; a page added to the home screen is treated as installed and kept.
   The answer is advisory either way, so nothing depends on it. */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

Store.all().then(() => render());
render();
flush();
</script>
